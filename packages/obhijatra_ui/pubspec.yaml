name: obhijatra_ui
description: Obhijatra shared Flutter UI - the Aninda Studio 5.0 theme, design tokens and bundled Noto fonts.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.9"

dependencies:
  flutter:
    sdk: flutter
  lucide_icons_flutter: 4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: 6.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: Noto Sans Bengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
    - family: Noto Serif
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerif-SemiBold.ttf
          weight: 600
    - family: Noto Serif Bengali
      fonts:
        - asset: assets/fonts/NotoSerifBengali-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerifBengali-SemiBold.ttf
          weight: 600
