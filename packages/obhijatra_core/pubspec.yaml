name: obhijatra_core
description: Pure-Dart core of Obhijatra - models, PocketBase client, sync queue, form engine, field encryption and report definitions. No Flutter imports.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.7

dependencies:
  clock: 1.1.3
  crypto: 3.0.8
  dartrosa: 0.1.2
  dartrosa_entities: 0.1.1
  drift: 2.35.3
  http: 1.6.0
  http_parser: 4.1.2
  obhijatra_device: any
  pocketbase: 0.25.3
  riverpod: 3.4.3
  sodium: 4.1.2+1
  uuid: 4.6.0
  xml: 7.0.1

dev_dependencies:
  build_runner: 2.16.1
  drift_dev: 2.35.2
  lints: 6.1.0
  test: 1.31.1
