name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

# Third-party actions are pinned by full commit SHA; the version is in the comment on each line.

jobs:
  analyze-test:
    name: Analyse and test (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - name: Test obhijatra_ui
        working-directory: packages/obhijatra_ui
        run: flutter test
      - name: Test field app
        working-directory: apps/field
        run: flutter test
      - name: Test manager app
        working-directory: apps/manager
        run: flutter test
      - name: Test manager app in a browser (device keys in WebCrypto)
        working-directory: apps/manager
        timeout-minutes: 10
        run: flutter test --platform chrome test/web

  core:
    name: Core tests (dart test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: dart test (unit)
        working-directory: packages/obhijatra_core
        run: dart test -x e2e
      - name: dart test (device trust, on the VM and compiled for browsers)
        working-directory: packages/obhijatra_device
        run: |
          dart test
          dart test -p chrome
          dart test -p chrome -c dart2wasm

  phase1-gate:
    name: Phase 1 gate (offline form reaches the real server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
      - name: Build the server binary the gate test starts
        working-directory: server
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o dist/obhijatra-server_0.1.0-dev_linux_amd64 ./cmd/obhijatra-server
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: dart test (e2e gate)
        working-directory: packages/obhijatra_core
        run: dart test -t e2e

  manager-web:
    name: Manager app (web, Wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web
        working-directory: apps/manager
        run: flutter build web --wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manager-web
          path: apps/manager/build/web
          if-no-files-found: error

  field-android:
    name: Field app (Android debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK
        working-directory: apps/field
        run: flutter build apk --debug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: field-debug-apk
          path: apps/field/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  manager-windows:
    name: Manager app (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows
        working-directory: apps/manager
        run: flutter build windows

  manager-macos:
    name: Manager app (macOS, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build macOS
        working-directory: apps/manager
        run: flutter build macos

  field-ios:
    name: Field app (iOS, no code signing)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS
        working-directory: apps/field
        run: flutter build ios --no-codesign

  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
      - name: Test and vet
        run: go test ./... && go vet ./...
      - name: Cross-build (no C compiler)
        env:
          CGO_ENABLED: "0"
          GOFLAGS: -mod=vendor
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -o /dev/null ./cmd/obhijatra-server
          done
      # Known vulnerabilities the server's code can actually reach. The exact
      # version is pinned; the Go checksum database verifies the download.
      - name: Vulnerability scan of the Go code (govulncheck v1.9.0)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # OSV-Scanner from its v2.7.0 release, checked against the SHA-256 that
      # release publishes (osv-scanner_SHA256SUMS) before it runs.
      - name: Install OSV-Scanner v2.7.0 (checksum verified)
        env:
          OSV_SCANNER_URL: https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/osv-scanner" "$OSV_SCANNER_URL"
          echo "$OSV_SCANNER_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      # Known vulnerabilities in the Dart packages (pubspec.lock) and the Go
      # modules (server/go.mod). Exceptions, each with a reason and an end
      # date, are in server/osv-scanner.toml.
      - name: Vulnerability scan of the dependencies (OSV-Scanner)
        run: '"$RUNNER_TEMP/osv-scanner" scan source --lockfile=../pubspec.lock --lockfile=go.mod'
