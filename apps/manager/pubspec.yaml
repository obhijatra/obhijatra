name: obhijatra_manager
description: Obhijatra manager app.
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  obhijatra_ui: any
  obhijatra_device: any
  flutter_riverpod: 3.5.0
  # Same version as obhijatra_core pins; the manager talks to the server with
  # it directly because core's barrel is not web-safe (dart:io, sodium, sqlite).
  pocketbase: 0.25.3
  http: 1.6.0
  http_parser: 4.1.2
  xml: 7.0.1
  shared_preferences: 2.5.6
  file_selector: 1.1.0
  url_launcher: 6.3.3
  # Device keys: the seeds in the operating system's protected storage on
  # desktop; non-extractable WebCrypto keys (through package:web) in browsers.
  flutter_secure_storage: 11.2.0
  web: 1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: 6.1.0

flutter:
  uses-material-design: true
  generate: true
