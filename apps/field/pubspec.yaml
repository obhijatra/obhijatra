name: obhijatra_field
description: Obhijatra field app.
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  obhijatra_core: any
  obhijatra_ui: any
  flutter_riverpod: 3.4.3
  drift: 2.35.3
  dartrosa_flutter: 0.2.1
  flutter_secure_storage: 11.2.0
  local_auth: 3.0.2
  # The prompt's words (Bangla); same versions local_auth resolves to.
  local_auth_android: 2.3.0
  local_auth_darwin: 2.0.5
  sqlite3: 3.8.0
  connectivity_plus: 7.3.2
  path_provider: 2.1.6
  url_launcher: 6.3.3
  lucide_icons_flutter: 4.0.1
  http: 1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: 6.1.0
  xml: 7.0.1

flutter:
  uses-material-design: true
  generate: true
